spring:
  application:
    name: account
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    default-schema: ${DATASOURCE_SCHEMA_NAME}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ACCOUNT_JWT_ISSUER_URI}
          jwk-set-uri: ${ACCOUNT_JWT_JWK_SET_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS}
      retries: ${KAFKA_PRODUCER_RETRIES}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE}

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.kafka.template: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        http.client.requests: 0.5,0.95,0.99
        spring.kafka.template: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_TRACING_ENDPOINT}

integration:
  notification:
    topic: ${NOTIFICATION_TOPIC}

resilience4j:
  circuitbreaker:
    instances:
      notificationService:
        slidingWindowType: ${RESILIENCE4J_NOTIFICATION_CB_SLIDING_WINDOW_TYPE}
        slidingWindowSize: ${RESILIENCE4J_NOTIFICATION_CB_SLIDING_WINDOW_SIZE}
        minimumNumberOfCalls: ${RESILIENCE4J_NOTIFICATION_CB_MINIMUM_NUMBER_OF_CALLS}
        permittedNumberOfCallsInHalfOpenState: ${RESILIENCE4J_NOTIFICATION_CB_PERMITTED_CALLS_HALF_OPEN}
        waitDurationInOpenState: ${RESILIENCE4J_NOTIFICATION_CB_WAIT_DURATION_OPEN_STATE}
        failureRateThreshold: ${RESILIENCE4J_NOTIFICATION_CB_FAILURE_RATE_THRESHOLD}
  retry:
    instances:
      notificationService:
        maxAttempts: ${RESILIENCE4J_NOTIFICATION_RETRY_MAX_ATTEMPTS}
        waitDuration: ${RESILIENCE4J_NOTIFICATION_RETRY_WAIT_DURATION}
