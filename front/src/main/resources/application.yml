spring:
  application:
    name: front
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${FRONT_CLIENT_ID}
            client-secret: ${FRONT_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          keycloak:
            authorization-uri: ${FRONT_AUTHORIZATION_URI}
            token-uri: ${FRONT_TOKEN_URI}
            user-info-uri: ${FRONT_USER_INFO_URI}
            user-name-attribute: preferred_username
            jwk-set-uri: ${FRONT_JWK_SET_URI}

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        http.client.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_TRACING_ENDPOINT}

front:
  api:
    account-base-url: ${FRONT_ACCOUNT_BASE_URL}
    cash-base-url: ${FRONT_CASH_BASE_URL}
    transfer-base-url: ${FRONT_TRANSFER_BASE_URL}
