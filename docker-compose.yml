services:
  bank-db:
    container_name: bank-db
    image: postgres:17.5
    restart: always
    mem_limit: 384m
    env_file:
      - ./env/bank-db.env
    ports:
      - "5433:5432"
    volumes:
      - ./dev/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/postgresql/data
    networks:
      - bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    mem_limit: 768m
    env_file:
      - ./env/keycloak.env
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank-network

  kafka:
    container_name: kafka
    image: bitnamilegacy/kafka:4.0.0-debian-12-r3
    restart: always
    mem_limit: 768m
    ports:
      - "9092:9092"
    env_file:
      - ./env/kafka.env
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - bank-network

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:3.5.1
    restart: always
    mem_limit: 512m
    ports:
      - "9411:9411"
    networks:
      - bank-network

  elasticsearch:
    container_name: elasticsearch
    image: bitnamilegacy/elasticsearch:8.12.2-debian-12-r0
    restart: always
    mem_limit: 768m
    environment:
      ELASTICSEARCH_ENABLE_SECURITY: "false"
      ELASTICSEARCH_HEAP_SIZE: 256m
      discovery.type: single-node
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/bitnami/elasticsearch
    networks:
      - bank-network

  logstash:
    container_name: logstash
    build:
      context: .
      dockerfile: logstash/Dockerfile
    image: my-bank-logstash:1.0.0
    restart: always
    mem_limit: 768m
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_started
    networks:
      - bank-network

  kibana:
    container_name: kibana
    image: bitnamilegacy/kibana:8.12.2-debian-12-r0
    restart: always
    mem_limit: 1g
    environment:
      KIBANA_ELASTICSEARCH_URL: http://elasticsearch
      KIBANA_ELASTICSEARCH_PORT_NUMBER: "9200"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_started
    networks:
      - bank-network

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    restart: always
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    networks:
      - bank-network

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager:v0.28.1
    restart: always
    mem_limit: 256m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - bank-network

  grafana:
    container_name: grafana
    image: grafana/grafana:12.3.0
    restart: always
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docker/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./helm/my-bank/dashboards:/var/lib/grafana/dashboards/my-bank:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - bank-network

  front-app:
    container_name: front-app
    build:
      context: .
      dockerfile: front/Dockerfile
    image: front-app:1.3.8
    restart: on-failure
    mem_limit: 384m
    ports:
      - "8086:8086"
    env_file:
      - ./env/front-app.env
    depends_on:
      keycloak:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - bank-network

  account-app:
    container_name: account-app
    build:
      context: .
      dockerfile: account/Dockerfile
    image: account-app:1.3.8
    restart: on-failure
    mem_limit: 384m
    ports:
      - "8082:8082"
    env_file:
      - ./env/account-app.env
    depends_on:
      bank-db:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - bank-network

  cash-app:
    container_name: cash-app
    build:
      context: .
      dockerfile: cash/Dockerfile
    image: cash-app:1.3.8
    restart: on-failure
    mem_limit: 384m
    ports:
      - "8083:8083"
    env_file:
      - ./env/cash-app.env
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - bank-network

  transfer-app:
    container_name: transfer-app
    build:
      context: .
      dockerfile: transfer/Dockerfile
    image: transfer-app:1.3.8
    restart: on-failure
    mem_limit: 384m
    ports:
      - "8084:8084"
    env_file:
      - ./env/transfer-app.env
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - bank-network

  notification-app:
    container_name: notification-app
    build:
      context: .
      dockerfile: notification/Dockerfile
    image: notification-app:1.3.8
    restart: on-failure
    mem_limit: 384m
    ports:
      - "8085:8085"
    env_file:
      - ./env/notification-app.env
    depends_on:
      kafka:
        condition: service_started
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - bank-network

volumes:
  db-data:
  kafka-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:

networks:
  bank-network:
