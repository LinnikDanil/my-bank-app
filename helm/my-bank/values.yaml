  ingest:
    replicaCount: 0

logstash:
  app:
    replicaCount: 1
    image:
      repository: my-bank-logstash
      tag: 1.0.0
      pullPolicy: IfNotPresent
    env:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    service:
      ports:
        beats: 5044
        api: 9600
    pipeline: |
      input {
        tcp {
          port => 5044
          codec => json_lines
        }
      }
      filter {
        if [timestamp] {
          date {
            match => ["timestamp", "ISO8601"]
            target => "@timestamp"
          }
        }

        mutate {
          add_field => {
            "[event][dataset]" => "bank.application"
          }
        }

        if [message] {
          mutate {
            gsub => [
              "message", "(?i)(password=)([^\\s,;]+)", "\\1***",
              "message", "(?i)(token=)([^\\s,;]+)", "\\1***",
              "message", "(?i)(bearer\\s+)([^\\s,;]+)", "\\1***"
            ]
          }
        }

        if [exception] {
          mutate {
            gsub => [
              "exception", "(?i)(password=)([^\\s,;]+)", "\\1***",
              "exception", "(?i)(token=)([^\\s,;]+)", "\\1***",
              "exception", "(?i)(bearer\\s+)([^\\s,;]+)", "\\1***"
            ]
          }
        }
      }
      output {
        elasticsearch {
          hosts => ["http://elasticsearch:9200"]
          index => "bank-logs-%{+YYYY.MM.dd}"
        }
        stdout {
          codec => rubydebug
        }
      }
    config: |
      http.host: 0.0.0.0
      xpack.monitoring.enabled: false
      pipeline.ordered: auto
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 768Mi

kibana:
  fullnameOverride: kibana
  replicaCount: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/kibana
    tag: 8.12.2-debian-12-r0
  savedObjects:
    configmap: '{{ .Release.Name }}-kibana-saved-objects'
    overwrite: true
  extraConfiguration:
    server.defaultRoute: /app/discover
  persistence:
    enabled: false
  elasticsearch:
    hosts:
      - elasticsearch
    port: 9200
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: kibana.localhost
    path: /
    pathType: Prefix
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  startupProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  livenessProbe:
    enabled: true
    initialDelaySeconds: 240
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
  initContainers:
    - name: wait-for-elasticsearch
      image: docker.io/bitnamilegacy/kibana:8.12.2-debian-12-r0
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -ec
        - |
          for attempt in $(seq 1 120); do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/elasticsearch/9200"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
