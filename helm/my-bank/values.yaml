    ingressClassName: nginx
    hosts:
      - grafana.localhost
    path: /
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

elasticsearch:
  fullnameOverride: elasticsearch
  security:
    enabled: false
  master:
    masterOnly: false
    replicaCount: 1
    heapSize: 512m
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 1Gi
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0

logstash:
  app:
    replicaCount: 1
    image:
      repository: docker.elastic.co/logstash/logstash
      tag: 8.5.1
      pullPolicy: IfNotPresent
    service:
      ports:
        beats: 5044
        api: 9600
    pipeline: |
      input {
        tcp {
          port => 5044
          codec => json_lines
        }
      }
      filter {
        if [timestamp] {
          date {
            match => ["timestamp", "ISO8601"]
            target => "@timestamp"
          }
        }

        mutate {
          add_field => {
            "[event][dataset]" => "bank.application"
          }
        }

        if [message] {
          mutate {
            gsub => [
              "message", "(?i)(password=)([^\\s,;]+)", "\\1***",
              "message", "(?i)(token=)([^\\s,;]+)", "\\1***",
              "message", "(?i)(bearer\\s+)([^\\s,;]+)", "\\1***"
            ]
          }
        }

        if [exception] {
          mutate {
            gsub => [
              "exception", "(?i)(password=)([^\\s,;]+)", "\\1***",
              "exception", "(?i)(token=)([^\\s,;]+)", "\\1***",
              "exception", "(?i)(bearer\\s+)([^\\s,;]+)", "\\1***"
            ]
          }
        }
      }
      output {
        elasticsearch {
          hosts => ["http://elasticsearch:9200"]
          index => "bank-logs-%{+YYYY.MM.dd}"
        }
        stdout {
          codec => rubydebug
        }
      }
    config: |
      http.host: 0.0.0.0
      xpack.monitoring.enabled: false
      pipeline.ordered: auto
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 768Mi

kibana:
  fullnameOverride: kibana
  replicaCount: 1
  savedObjects:
    configmap: "{{ .Release.Name }}-kibana-saved-objects"
    overwrite: true
  extraConfiguration:
