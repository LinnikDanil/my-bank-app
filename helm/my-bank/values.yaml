          host: kafka-broker
          port: 9092
        - name: keycloak
          host: keycloak
          port: 80
        - name: logstash
          host: logstash
          port: 5044
    probes:
      startup:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 90
      readiness:
        enabled: true
        initialDelaySeconds: 90
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      liveness:
        enabled: true
        initialDelaySeconds: 180
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1Gi

