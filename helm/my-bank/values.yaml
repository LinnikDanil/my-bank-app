ingress:
  enabled: true
  className: nginx
  annotations: {}
  paths:
    - path: /realms
      pathType: Prefix
      service:
        name: keycloak
        port: 80
    - path: /resources
      pathType: Prefix
      service:
        name: keycloak
        port: 80
    - path: /
      pathType: Prefix
      service:
        name: front
        port: 8086

postgresql:
  fullnameOverride: postgresql
  auth:
    username: postgres
    database: bank
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
    persistence:
      enabled: true
      size: 2Gi
    initdb:
      scripts:
        01-create-schema.sql: |
          CREATE SCHEMA IF NOT EXISTS bank_app;
          CREATE SCHEMA IF NOT EXISTS notification_app;
          CREATE SCHEMA IF NOT EXISTS transfer_app;

keycloak:
  image:
    repository: bitnamilegacy/keycloak
    tag: 26.3.3-debian-12-r0
  volumePermissions:
    enabled: false
  fullnameOverride: keycloak
  postgresql:
    enabled: false
  production: false
  auth:
    adminUser: admin
  externalDatabase:
    host: postgresql
    port: 5432
    user: postgres
    database: bank
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  httpRelativePath: /
  extraStartupArgs: "--import-realm"
  extraEnvVars:
    - name: JAVA_OPTS_KC_HEAP
      value: "-Xms128m -Xmx512m"
    - name: KC_HOSTNAME
      value: localhost
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KC_PROXY_HEADERS
      value: xforwarded
    - name: KC_HTTP_ENABLED
      value: "true"
  extraVolumes:
    - name: realm-import
      secret:
        secretName: keycloak-realm-import
  extraVolumeMounts:
    - name: realm-import
      mountPath: /opt/bitnami/keycloak/data/import
      readOnly: true
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    enabled: true
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    enabled: true
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

kafka:
  fullnameOverride: kafka
  image:
    repository: kafkace/kafka
    tag: v3.7.1-63ba8d2
    pullPolicy: IfNotPresent
  broker:
    replicaCount: 1
    heapOpts: "-Xms256m -Xmx512m"
    config:
      num.partitions: "3"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 768Mi
    persistence:
      enabled: true
      size: 2Gi
kafkaTopic:
  name: notification-events
  partitions: 3
  replicationFactor: 1
  initJob:
    enabled: true
    image:
      repository: kafkace/kafka
      tag: v3.7.1-63ba8d2
      pullPolicy: IfNotPresent

zipkin:
  fullnameOverride: zipkin
  replicaCount: 1
  zipkin:
    storage:
      type: mem
  ingress:
    enabled: true
    className: nginx
    host: zipkin.localhost
    path: /
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  alertmanager:
    enabled: true
    persistentVolume:
      enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: my-bank-http
          rules:
            - alert: MyBankServiceDown
              expr: up{job="my-bank-apps"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Сервис my-bank недоступен"
                description: "Prometheus не может получить метрики с {{ $labels.instance }} более 2 минут."
            - alert: MyBankHighHttp5xxRate
              expr: sum by (instance) (rate(http_server_requests_seconds_count{job="my-bank-apps",status=~"5.."}[5m])) > 0.05
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Повышенный уровень 5xx"
                description: "На {{ $labels.instance }} доля 5xx превышает порог 0.05 RPS в течение 5 минут."
            - alert: MyBankHighHttpP95Latency
              expr: histogram_quantile(0.95, sum by (le, instance) (rate(http_server_requests_seconds_bucket{job="my-bank-apps"}[5m]))) > 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Высокая latency p95"
                description: "На {{ $labels.instance }} p95 входящих HTTP-запросов превышает 1 секунду более 10 минут."
        - name: my-bank-business
          rules:
            - alert: MyBankCashDepositFailures
              expr: sum by (username) (increase(bank_cash_deposit_failures_total[10m])) > 2
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: "Много неуспешных пополнений"
                description: "У пользователя {{ $labels.username }} больше 2 неуспешных попыток пополнения за 10 минут."
            - alert: MyBankCashWithdrawFailures
              expr: sum by (username) (increase(bank_cash_withdraw_failures_total[10m])) > 2
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: "Много неуспешных снятий"
                description: "У пользователя {{ $labels.username }} больше 2 неуспешных попыток снятия за 10 минут."
            - alert: MyBankTransferFailures
              expr: sum by (username_from, username_to) (increase(bank_transfer_failures_total[10m])) > 1
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: "Неуспешные переводы"
                description: "Пара {{ $labels.username_from }} -> {{ $labels.username_to }} имеет больше 1 неуспешной попытки перевода за 10 минут."
  server:
    persistentVolume:
      enabled: false
    extraScrapeConfigs:
      - job_name: my-bank-apps
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - front:8086
              - account:8082
              - cash:8083
              - transfer:8084
              - notification:8085
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - prometheus.localhost
      path: /
      pathType: Prefix
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 768Mi

grafana:
  fullnameOverride: grafana
  persistence:
    enabled: false
  adminUser: admin
  adminPassword: admin
  datasources:
    datasources.yaml:
      apiVersion: 1
