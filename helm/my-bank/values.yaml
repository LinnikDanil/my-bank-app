global:
  imagePullPolicy: IfNotPresent
  security:
    allowInsecureImages: true

front:
  app:
    nameOverride: front
    replicaCount: 1
    image:
      repository: front-app
      tag: 1.3.8
      pullPolicy: IfNotPresent
    service:
      port: 8086
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8086"
    env:
      SERVER_PORT: "8086"
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      FRONT_CLIENT_ID: front
      FRONT_AUTHORIZATION_URI: http://localhost/realms/my-bank-realm/protocol/openid-connect/auth
      FRONT_TOKEN_URI: http://keycloak/realms/my-bank-realm/protocol/openid-connect/token
      FRONT_USER_INFO_URI: http://keycloak/realms/my-bank-realm/protocol/openid-connect/userinfo
      FRONT_JWK_SET_URI: http://keycloak/realms/my-bank-realm/protocol/openid-connect/certs
      FRONT_ACCOUNT_BASE_URL: http://account:8082
      FRONT_CASH_BASE_URL: http://cash:8083
      FRONT_TRANSFER_BASE_URL: http://transfer:8084
    waitForDependencies:
      enabled: true
      checks:
        - name: keycloak
          host: keycloak
          port: 80
        - name: logstash
          host: logstash
          port: 5044
        - name: account
          host: account
          port: 8082
        - name: cash
          host: cash
          port: 8083
        - name: transfer
          host: transfer
          port: 8084
    probes:
      startup:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 90
      readiness:
        enabled: true
        initialDelaySeconds: 90
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      liveness:
        enabled: true
        initialDelaySeconds: 180
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1Gi

account:
  app:
    nameOverride: account
    replicaCount: 1
