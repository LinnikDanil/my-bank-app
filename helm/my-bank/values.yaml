      tag: 1.3.0
      pullPolicy: IfNotPresent
    service:
      enabled: true
      port: 8085
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8085"
    env:
      SERVER_PORT: "8085"
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
      DATASOURCE_SCHEMA_NAME: notification_app
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/bank?currentSchema=notification_app
      SPRING_DATASOURCE_USERNAME: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-0.kafka-headless:9092
      NOTIFICATION_TOPIC: notification-events
      NOTIFICATION_CONSUMER_GROUP_ID: notification-service
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      KAFKA_LISTENER_ACK_MODE: manual_immediate
