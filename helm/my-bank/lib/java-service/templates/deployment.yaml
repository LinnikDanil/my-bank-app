apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "java-service.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "java-service.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "java-service.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "java-service.name" . }}
    spec:
      {{- if and .Values.waitForDependencies.enabled .Values.waitForDependencies.checks }}
      initContainers:
        - name: wait-for-dependencies
          image: "{{ .Values.waitForDependencies.image.repository }}:{{ .Values.waitForDependencies.image.tag }}"
          imagePullPolicy: {{ .Values.waitForDependencies.image.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              wait_tcp() {
                local name="$1"
                local host="$2"
                local port="$3"
                local attempt=0
                until timeout {{ .Values.waitForDependencies.timeoutSeconds }} bash -c "cat < /dev/null > /dev/tcp/${host}/${port}"; do
                  attempt=$((attempt + 1))
                  if [ "$attempt" -ge {{ .Values.waitForDependencies.maxAttempts }} ]; then
                    echo "Timeout waiting for ${name} (${host}:${port})"
                    return 1
                  fi
                  echo "Waiting for ${name} (${host}:${port}), attempt ${attempt}"
                  sleep {{ .Values.waitForDependencies.sleepSeconds }}
                done
                echo "${name} is reachable (${host}:${port})"
              }

              {{- range .Values.waitForDependencies.checks }}
              wait_tcp "{{ .name }}" "{{ .host }}" "{{ .port }}"
              {{- end }}
      {{- end }}
      containers:
        - name: {{ include "java-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "java-service.name" . }}-config
            - secretRef:
                name: {{ include "java-service.name" . }}-secret
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
